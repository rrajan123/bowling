<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bowling Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.tab-pane { padding-top: 1rem; }</style>
</head>
<body class="bg-light">
<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Bowling Tracker <span id="year" class="text-secondary"></span></h1>
    <div id="likesTotalHost"></div>
  </div>

  <!-- New Session (Front page ONLY) -->
  <div id="entry" class="card mb-4">
    <div class="card-header">New Session</div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Bowler</label>
          <input id="bowlerInput" list="bowlersList" class="form-control" placeholder="Start typing a name">
          <datalist id="bowlersList"></datalist>
        </div>
        <div class="col-md-3">
          <label class="form-label">Alley</label>
          <select id="alley" class="form-select"></select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Date</label>
          <input id="date" type="date" class="form-control">
        </div>
        <div class="col-md-2 text-end">
          <button id="save" class="btn btn-primary w-100">Save</button>
          <button id="clear" class="btn btn-outline-secondary w-100 mt-2">Clear</button>
        </div>
      </div>
      <hr>
      <div class="d-flex align-items-center justify-content-between">
        <label class="form-label mb-0">Scores (max 12)</label>
        <button id="addGame" type="button" class="btn btn-sm btn-outline-primary">+ Add Game</button>
      </div>
      <div id="scoresWrap" class="row row-cols-2 row-cols-md-6 g-2 mt-2"></div>
      <div id="liveStats" class="mt-3 text-secondary small"></div>
    </div>
  </div>

  <!-- Tabs for Sessions / Totals / Honor Roll -->
  <ul class="nav nav-tabs" id="mainTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="sessions-tab" data-bs-toggle="tab" data-bs-target="#sessions-pane" type="button" role="tab" aria-controls="sessions-pane" aria-selected="true">Sessions</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="totals-tab" data-bs-toggle="tab" data-bs-target="#totals-pane" type="button" role="tab" aria-controls="totals-pane" aria-selected="false">Totals</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="honor-tab" data-bs-toggle="tab" data-bs-target="#honor-pane" type="button" role="tab" aria-controls="honor-pane" aria-selected="false">Honor Roll</button>
    </li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="sessions-pane" role="tabpanel" aria-labelledby="sessions-tab">
      <div class="card mt-3">
        <div class="card-header">Sessions</div>
        <div class="card-body" id="sessionsTable">Loading…</div>
      </div>
    </div>
    <div class="tab-pane fade" id="totals-pane" role="tabpanel" aria-labelledby="totals-tab">
      <div class="card mt-3">
        <div class="card-header">Totals</div>
        <div class="card-body" id="totalsBlock">Loading…</div>
      </div>
    </div>
    <div class="tab-pane fade" id="honor-pane" role="tabpanel" aria-labelledby="honor-tab">
      <div class="card mt-3">
        <div class="card-header">Honor Roll</div>
        <div class="card-body" id="honorRollBlock">Loading…</div>
      </div>
    </div>
  </div>

</div>

<!-- Session Modal -->
<div class="modal fade" id="sessionModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="sessionMeta">Session</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="sessionStats" class="mb-3"></div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th class="text-end">Score</th>
                <th class="text-end">Like</th>
              </tr>
            </thead>
            <tbody id="sessionGamesTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/app.addgame.js"></script>
<script>
// Lazy render on tab change (works with your existing app.js functions)
document.addEventListener("DOMContentLoaded", () => {
  const tabs = document.querySelectorAll('button[data-bs-toggle="tab"]');
  tabs.forEach(tab => {
    tab.addEventListener('shown.bs.tab', async (e) => {
      const id = e.target.id;
      try {
        if (id === 'sessions-tab' && typeof renderSessions === 'function') await renderSessions();
        if (id === 'totals-tab' && typeof renderTotals === 'function') await renderTotals();
        if (id === 'honor-tab' && typeof renderHonorRoll === 'function') await renderHonorRoll();
      } catch (err) { console.error(err); }
    });
  });
});
</script>
</body>
</html>
